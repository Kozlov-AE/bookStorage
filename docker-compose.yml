services:
  api:
    build:
      context: .
      dockerfile: backend.Dockerfile
    expose:
      - "8080"
    environment:
      - Storage__BooksPath=/data/books
      - Storage__MetadataPath=/data/metadata
      - Database__Provider=SQLite
      - Database__ConnectionString=Data Source=/data/db/booksbookStorage.sqlite
    volumes:
      - C:/Temp/bookStorage/db:/data/db
      - C:/Temp/bookStorage/books:/data/books
      - C:/Temp/bookStorage/metadata:/data/metadata
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "5", "http://localhost:8080/api/books"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
